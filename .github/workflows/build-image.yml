name: Build and publish trainbigdata image

# Builds the course sandbox for linux/amd64 + linux/arm64 and pushes to
# GitHub Container Registry, so students only ever `docker compose pull`
# and never build Hadoop/Hive/HBase/Spark locally themselves.
#
# Tagging:
#   any push to master        -> ghcr.io/.../trainbigdata:2026 (rolling, what class compose files point at)
#   every build                -> ghcr.io/.../trainbigdata:sha-<short sha> (traceable, never overwritten)
#   a pushed tag v2026.N        -> ghcr.io/.../trainbigdata:2026.N (a pinned version for a specific class run)

on:
  push:
    branches: [master]
    tags: ["v2026*"]
    paths:
      - "docker/**"
      - "labs/**"
      - "datasets/**"
      - "scripts/labctl"
      - ".github/workflows/build-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bobbylovemovie/trainbigdata

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64 on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS},${IMAGE}:2026"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v2026* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAGS="${TAGS},${IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
