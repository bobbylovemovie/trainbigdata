[supervisord]
nodaemon=true
logfile=/var/log/lab/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; --- MariaDB: backs the Hive metastore and the JDBC-ingestion lab ----------
[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/lab/mariadb.log
stderr_logfile=/var/log/lab/mariadb.err.log

; --- HDFS -------------------------------------------------------------------
[program:namenode]
command=/opt/hadoop/bin/hdfs namenode
user=student
environment=HOME="/home/student",USER="student"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/lab/namenode.log
stderr_logfile=/var/log/lab/namenode.err.log

[program:datanode]
command=/opt/hadoop/bin/hdfs datanode
user=student
environment=HOME="/home/student",USER="student"
autostart=true
autorestart=true
priority=11
stdout_logfile=/var/log/lab/datanode.log
stderr_logfile=/var/log/lab/datanode.err.log

; --- YARN ---------------------------------------------------------------
[program:resourcemanager]
command=/opt/hadoop/bin/yarn resourcemanager
user=student
environment=HOME="/home/student",USER="student"
autostart=true
autorestart=true
priority=12
stdout_logfile=/var/log/lab/resourcemanager.log
stderr_logfile=/var/log/lab/resourcemanager.err.log

[program:nodemanager]
command=/opt/hadoop/bin/yarn nodemanager
user=student
environment=HOME="/home/student",USER="student"
autostart=true
autorestart=true
priority=13
stdout_logfile=/var/log/lab/nodemanager.log
stderr_logfile=/var/log/lab/nodemanager.err.log

; --- one-shot bootstrap: create /user/student, /user/hive/warehouse, /hbase,
;     the Hive metastore schema and the labdb sample DB once services are up.
[program:bootstrap]
command=/usr/local/bin/bootstrap-hdfs.sh
autostart=true
autorestart=false
startsecs=0
priority=20
stdout_logfile=/var/log/lab/bootstrap.log
stderr_logfile=/var/log/lab/bootstrap.err.log

; --- HBase (started on demand via labctl) -----------------------------------
; HBase's managed ZooKeeper quorum peer must be started explicitly here --
; start-hbase.sh normally does this for you, but we launch each daemon
; directly (no SSH between "nodes") so it has its own program entry.
[program:hbase-zookeeper]
command=/opt/hbase/bin/hbase zookeeper start
user=student
environment=HOME="/home/student",USER="student"
autostart=false
autorestart=true
priority=29
stdout_logfile=/var/log/lab/hbase-zookeeper.log
stderr_logfile=/var/log/lab/hbase-zookeeper.err.log

[program:hbase-master]
command=/opt/hbase/bin/hbase master start
user=student
environment=HOME="/home/student",USER="student"
autostart=false
autorestart=true
priority=30
stdout_logfile=/var/log/lab/hbase-master.log
stderr_logfile=/var/log/lab/hbase-master.err.log

[program:hbase-regionserver]
command=/opt/hbase/bin/hbase regionserver start
user=student
environment=HOME="/home/student",USER="student"
autostart=false
autorestart=true
priority=31
stdout_logfile=/var/log/lab/hbase-regionserver.log
stderr_logfile=/var/log/lab/hbase-regionserver.err.log

; --- Hive (started on demand via labctl) ------------------------------------
[program:hive-metastore]
command=/opt/hive/bin/hive --service metastore
user=student
environment=HOME="/home/student",USER="student"
autostart=false
autorestart=true
priority=40
stdout_logfile=/var/log/lab/hive-metastore.log
stderr_logfile=/var/log/lab/hive-metastore.err.log

[program:hive-server2]
command=/opt/hive/bin/hive --service hiveserver2
user=student
environment=HOME="/home/student",USER="student"
autostart=false
autorestart=true
priority=41
stdout_logfile=/var/log/lab/hive-server2.log
stderr_logfile=/var/log/lab/hive-server2.err.log

; --- JupyterLab ---------------------------------------------------------
[program:jupyterlab]
command=/usr/local/bin/jupyter-lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token='' --ServerApp.password='' --ServerApp.root_dir=/home/student
user=student
; SHELL matters here: jupyter_server_terminals picks its terminal shell as
; `[os.environ.get("SHELL") or which("sh")]` (see its app.py) -- with no
; SHELL set it falls back to /bin/sh (dash), which has no arrow-key/readline
; editing, so arrows print raw ^[[C / ^[[D instead of moving the cursor.
environment=HOME="/home/student",USER="student",SHELL="/bin/bash",TERM="xterm-256color"
directory=/home/student
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/lab/jupyterlab.log
stderr_logfile=/var/log/lab/jupyterlab.err.log
