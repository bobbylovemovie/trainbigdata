# Single-node KRaft config: this one process is both the controller and
# the broker (Kafka 3.x+ doesn't need a separate ZooKeeper process). Tuned
# for a laptop teaching sandbox, not production.

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# NOT HDFS. Kafka has its own storage layer (local log-segment files); it
# is not part of Hadoop's filesystem and does not go through the
# NameNode/DataNode. This just happens to live under the same persisted
# Docker volume as HDFS's data, purely to avoid adding a second named
# volume -- see labs/07-kafka for the full explanation.
log.dirs=/opt/hadoop/data/kafka-logs

num.partitions=1
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

num.network.threads=3
num.io.threads=4
log.retention.hours=24
